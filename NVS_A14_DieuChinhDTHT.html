<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A.1.4 – Điều chỉnh dạy thêm</title><link rel="stylesheet" href="./HVA_EDOS_Form_Standard.css"><style>*{box-sizing:border-box}body{margin:0;font:15px Arial,sans-serif;color:#123b56;background:#f7fcff}main{max-width:900px;margin:20px auto;padding:12px}section{border:1px solid #b8ddf2;border-radius:10px;background:white;padding:16px;margin-bottom:12px}h1{font-size:22px}label{display:block;font-weight:bold;margin:12px 0 5px}input,select,textarea{width:100%;padding:10px;border:1px solid #b8ddf2;font:inherit}button{background:#0b57d0;color:white;border:0;border-radius:8px;padding:12px;font:inherit;font-weight:bold}button:disabled{opacity:.5}#account{background:#0b57d0;color:white;padding:12px;border-radius:8px}.notice{background:#fff3e0;color:#a65308;padding:12px;border-radius:8px}.dates{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:600px){.dates{grid-template-columns:1fr}}</style><style id="hva-a1-visual-final-v1">.hva-report-head{background:linear-gradient(115deg,#074b91,#087fc2)!important}.hva-report-brand small{font-size:12px!important}.hva-report-online{font-weight:800!important}.hva-report-nav a{background:#0879bd!important}.hva-report-nav a svg{stroke-width:2.8}.hva-report-head:before{background:radial-gradient(circle at 15% 30%,#ffffff80 0 2px,transparent 3px),radial-gradient(circle at 82% 65%,#ffffff80 0 2px,transparent 3px),repeating-linear-gradient(15deg,transparent 0 95px,#ffffff25 96px 97px,transparent 98px 180px),repeating-linear-gradient(155deg,transparent 0 120px,#ffffff25 121px 122px,transparent 123px 210px)!important}@media(max-width:600px){.hva-report-head:after{font-size:11px!important}.hva-report-brand{font-size:23px!important}}.hva-report-account-sign .identity-name{font-size:16px!important;font-weight:800!important}.hva-report-account-sign .identity-avatar{color:white!important;background:transparent!important}.hva-report-account-sign .identity-meta{font-size:13px!important}.hva-report-account-sign .identity-label-row{display:none!important}.hva-report-account-sign .identity-person>div>div[style]{display:none!important}.hva-report-account-sign .hva-sign-method-heading{margin:0 0 6px!important}.hva-report-account-sign .hva-sign-choice-icon{display:none!important}</style><style>main{margin:0 auto;padding:14px;max-width:900px}h1{font-size:clamp(19px,3.4vw,25px);background:white;border:1px solid #d5e5f4;border-radius:20px;padding:16px;margin:0 0 12px}section{border-radius:20px;padding:16px}#account{font-weight:700;padding:14px;border-radius:12px;margin-bottom:12px}input,select,textarea{border-radius:10px;min-height:46px}button{min-height:46px}#report button{width:100%;margin-top:12px}#report button:disabled{background:#eaf5ff;color:#456785;opacity:1}.hva-report-online{white-space:nowrap;font-size:10px!important}.dates:has(#until[hidden]){grid-template-columns:1fr}.notice{display:none}</style><style id="a14-sign-standard">.hva-report-account-sign{border:1px solid #b8ddf2;border-radius:12px;overflow:hidden;margin-bottom:12px;background:#edf6fc}#account{margin:0!important;border-radius:0!important}#hvaSignMethodPanel{padding:12px!important;margin:0!important;border:0!important}#hvaSignMethodPanel .hva-sign-method-eyebrow,#hvaSignMethodPanel .hva-sign-choice-icon{display:none!important}#hvaSignMethodPanel .hva-sign-options{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}#hvaSignMethodPanel label{position:relative;margin:8px 0 0;padding:12px;min-height:48px;border:1px solid #a8cce9;border-radius:9px;background:white;display:flex;align-items:center;gap:8px}#hvaSignMethodPanel input{width:auto;min-height:0}#hvaSignMethodPanel label:has(input:checked){background:#e5f2ff;border-color:#0879bd}#hvaSignMethodPanel label:has(input:disabled){opacity:.55}#hvaSignMethodPanel .hva-sign-choice-check{display:none}</style></head><body><div class="hva-report-head" role="banner"><nav class="hva-report-nav" aria-label="Điều hướng"><a href="./NghiepVu.html" aria-label="Quay lại"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5m7-7-7 7 7 7"/></svg></a><a href="./index.html" aria-label="Trang chủ"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 10 9-7 9 7M5 9v12h5v-7h4v7h5V9"/></svg></a></nav><div class="hva-report-brand">HVA–<b>EDOS</b><small>HỆ THỐNG QUẢN TRỊ GIÁO DỤC – TRƯỜNG THPT HÒA VANG</small></div><span class="hva-report-online">CHƯA KẾT NỐI</span></div><main><h1>A.1.4 · Báo cáo điều chỉnh, bổ sung thông tin</h1><div class="hva-report-account-sign"><div id="account">Chưa xác định tài khoản</div><div class="hva-sign-method" id="hvaSignMethodPanel" role="group" aria-labelledby="hvaSignMethodTitle">
      <div class="hva-sign-method-heading"><span class="hva-sign-method-eyebrow"><i class="bi bi-pen" aria-hidden="true"></i> PHƯƠNG THỨC XÁC NHẬN</span><strong id="hvaSignMethodTitle">Hình thức ký</strong></div>
      <div class="hva-sign-options">
        <label class="hva-sign-choice">
          <input type="radio" name="hvaSignMethod" value="ELECTRONIC" disabled>
          <span class="hva-sign-choice-icon"><i class="bi bi-shield-check" aria-hidden="true"></i></span>
          <span class="hva-sign-choice-copy"><b>Ký điện tử</b></span>
          <span class="hva-sign-choice-check" aria-hidden="true"><i class="bi bi-check"></i></span>
        </label>
        <label class="hva-sign-choice">
          <input type="radio" name="hvaSignMethod" value="PAPER" checked>
          <span class="hva-sign-choice-icon"><i class="bi bi-printer" aria-hidden="true"></i></span>
          <span class="hva-sign-choice-copy"><b>Ký tay</b></span>
          <span class="hva-sign-choice-check" aria-hidden="true"><i class="bi bi-check"></i></span>
        </label>
      </div>
      
    </div></div><p class="notice">Đang phát triển: chỉ chuẩn bị và xem trước nội dung; chưa tiếp nhận hồ sơ chính thức.</p><section><form id="report"><label for="kind">Loại báo cáo</label><select id="kind"><option>Thay đổi thông tin dạy thêm</option><option>Tạm nghỉ dạy thêm</option><option>Tiếp tục dạy thêm</option><option>Chấm dứt tham gia dạy thêm</option><option>Bổ sung hồ sơ, minh chứng</option></select><label for="facility">Tên cơ sở tổ chức dạy thêm</label><input id="facility" required><div class="dates"><div><label for="from">Ngày có hiệu lực</label><input id="from" type="date" required></div><div id="until" hidden><label for="to">Dự kiến nghỉ đến ngày</label><input id="to" type="date"></div></div><label for="reason">Nội dung điều chỉnh / lý do</label><textarea id="reason" rows="5" required></textarea><label for="link">Liên kết hồ sơ, minh chứng (Google Drive)</label><input id="link" type="url" placeholder="https://drive.google.com/..." ><button type="submit">Xem trước báo cáo</button> <button type="button" disabled>Nộp hồ sơ · Chưa kết nối</button></form></section><section id="preview" hidden><h2>Bản xem trước – chưa gửi</h2><pre id="output" style="white-space:pre-wrap;font:inherit"></pre></section></main><script>const $=id=>document.getElementById(id);let u={};try{u=JSON.parse(sessionStorage.getItem('user')||localStorage.getItem('user')||'{}')}catch(e){}const name=u.hoTen||u.fullName||u.name||u.tenDangNhap||'';$('account').textContent=[name||'Chưa xác định tài khoản',u.toChuyenMon||u.toBoPhan||u.team||u.to||'',u.chucVu||''].filter(Boolean).join(' | ');$('kind').onchange=()=>{$('until').hidden=$('kind').selectedIndex!==1};$('from').onchange=()=>{$('to').min=$('from').value};$('report').onsubmit=e=>{e.preventDefault();if(!$('until').hidden&&$('to').value&&$('to').value<$('from').value){alert('Ngày kết thúc không hợp lệ');return}if($('link').value&&!/^https:\/\/(drive|docs)\.google\.com\//i.test($('link').value)){alert('Vui lòng dùng liên kết Google Drive hoặc Docs');return}$('output').textContent=['Người lập: '+(name||'Chưa xác định'),'Hình thức ký: Ký tay',$('kind').value,'Cơ sở: '+$('facility').value,'Hiệu lực: '+$('from').value,...(!$('until').hidden?['Dự kiến đến: '+$('to').value]:[]),$('reason').value,'Minh chứng: '+$('link').value].join('\n');$('preview').hidden=false};</script></body></html>
