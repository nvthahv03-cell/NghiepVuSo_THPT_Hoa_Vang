(async()=>{let db;try{const bytes=Uint8Array.from(atob(payload),c=>c.charCodeAt(0)),stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));db=JSON.parse(await new Response(stream).text())}catch(e){document.getElementById('message').textContent='Không thể đọc dữ liệu TKB: '+e.message;return}
const $=x=>document.getElementById(x),days=['Hai','Ba','Tư','Năm','Sáu','Bảy'],modes=[...document.querySelectorAll('[data-mode]')],sel=$('select'),search=$('search'),msg=$('message'),result=$('result');let mode='personal';
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase().replace(/[^a-z0-9]/g,'');
const classes=[...new Set(db.matrix.map(x=>x[2]))].sort((a,b)=>a.localeCompare(b,'vi',{numeric:true}));
function identity(){for(const storage of [localStorage,sessionStorage]){try{const u=JSON.parse(storage.getItem('user')||'null');if(u&&typeof u==='object'){const v=[u.hoTen,u.fullName,u.name,u.displayName].find(x=>typeof x==='string'&&x.trim());if(v)return v.trim()}}catch(e){}}try{const p=window.parent;if(p!==window){for(const storage of [p.localStorage,p.sessionStorage]){const u=JSON.parse(storage.getItem('user')||'null');const n=u?.hoTen||u?.fullName||u?.name||u?.displayName;if(n)return n}}}catch(e){}return ''}
function matches(text,q){return norm(text).includes(norm(q))}function teacherFind(q){const n=norm(q);if(!n)return [];return db.teachers.filter(t=>matches(t.name,q)||t.name.split(/\s+/).map(w=>w[0]).join('').toLowerCase()===n)}
function table(rows,type){const headers=type==='class'?['Thứ','Tiết','Buổi','Môn','Giáo viên']:type==='teacher'?['Thứ','Tiết','Buổi','Lớp','Môn']:['Thứ','Tiết','Lớp','Môn','Giáo viên'];const tab=document.createElement('table');tab.className='tkb';const tr=document.createElement('tr');headers.forEach(x=>{const th=document.createElement('th');th.textContent=x;tr.append(th)});const head=document.createElement('thead');head.append(tr);tab.append(head);const body=document.createElement('tbody');rows.sort((a,b)=>days.indexOf(a[0])-days.indexOf(b[0])||a[1]-b[1]||String(a[2]).localeCompare(String(b[2]),'vi'));for(const r of rows){const cells=type==='class'?[r[0],r[1],r[1]>5?'Chiều':'Sáng',r[3],r[4]]:type==='teacher'?[r[0],r[1],r[1]>5?'Chiều':'Sáng',r[2],r[3]]:[r[0],r[1],r[2],r[3],r[4]];const row=document.createElement('tr');cells.forEach((x,i)=>{const td=document.createElement('td');td.textContent=x; if(i===0)td.className='day';if(i===1)td.className='period';row.append(td)});body.append(row)}tab.append(body);const box=document.createElement('div');box.className='tablebox';box.append(tab);return box}
function empty(s){const p=document.createElement('p');p.className='info';p.textContent=s;result.append(p)}function teacherRender(t){$('title').textContent='TKB GIÁO VIÊN – '+t.name;const rows=t.lessons.map(r=>[r[0],r[1],r[2],r[3]]);if(!rows.length)return empty('Chưa có tiết học trong dữ liệu nguồn.');result.append(table(rows,'teacher'))}
function fillSelect(items){sel.replaceChildren();for(const v of items){const o=document.createElement('option');o.value=v;o.textContent=v;sel.append(o)}}
function render(){result.replaceChildren();sel.hidden=true;search.hidden=true;msg.textContent='Nguồn: TKB Hòa Vang lần 2 · 02/11/2026. Ô chưa có dữ liệu không đồng nghĩa với tiết nghỉ.';modes.forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));if(mode==='class'){sel.hidden=false;const klass=sel.value||classes[0];$('title').textContent='THỜI KHÓA BIỂU LỚP '+klass;const a=db.matrix.filter(r=>r[2]===klass);a.length?result.append(table(a,'class')):empty('Chưa có dữ liệu TKB cho lớp này.');return}if(mode==='teacher'){sel.hidden=false;search.hidden=false;const t=db.teachers.find(t=>t.name===sel.value);if(t)teacherRender(t);else empty('Chọn giáo viên cần xem.');return}if(mode==='personal'){const name=identity();const m=teacherFind(name);if(m.length===1){teacherRender(m[0]);return}$('title').textContent='TKB CỦA TÔI';empty(name?'Không xác định được duy nhất TKB khớp với tài khoản '+name+'. Vui lòng chọn mục Theo GV.':'Chưa tìm thấy tên giáo viên trong phiên đăng nhập. Vui lòng chọn mục Theo GV.');return}const b=mode==='morning';$('title').textContent=b?'TKB BUỔI SÁNG':'TKB BUỔI CHIỀU';const a=db.matrix.filter(r=>b?r[1]<=5:r[1]>=6);result.append(table(a,'all'))}
function changeMode(v){mode=v;search.value='';if(v==='class')fillSelect(classes);if(v==='teacher')fillSelect(db.teachers.map(t=>t.name));render()}
modes.forEach(b=>b.addEventListener('click',()=>changeMode(b.dataset.mode)));sel.addEventListener('change',render);search.addEventListener('input',()=>{if(mode!=='teacher')return;const matches=db.teachers.filter(t=>matchesName(t.name,search.value));const current=sel.value;fillSelect(matches.map(t=>t.name));if(matches.some(t=>t.name===current))sel.value=current;render()});function matchesName(name,q){if(!q)return true;return matches(name,q)||norm(name.split(/\s+/).map(x=>x[0]).join(''))===norm(q)}$('print').onclick=()=>print();changeMode(new URLSearchParams(location.search).get('view')||'personal');
})();
